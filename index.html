<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Frontend practice project</p>
      <h1 id="page-title">Color Palette Generator</h1>
      <p class="intro">Generate balanced five-color palettes, lock shades you like, copy hex codes and save favorites in this browser.</p>
    </section>

    <section class="palette-card" aria-label="Current color palette">
      <div class="toolbar">
        <button id="generateButton" class="primary-button" type="button">Generate palette</button>
        <button id="saveButton" class="secondary-button" type="button">Save palette</button>
        <p class="shortcut">Tip: press Space to generate</p>
      </div>
      <div id="paletteGrid" class="palette-grid" aria-live="polite"></div>
    </section>

    <section class="saved-section" aria-labelledby="saved-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Local collection</p>
          <h2 id="saved-title">Saved palettes</h2>
        </div>
        <span id="savedCount" class="saved-count">0 saved</span>
      </div>
      <div id="emptyState" class="empty-state">No saved palettes yet. Generate a palette and save it here.</div>
      <div id="savedList" class="saved-list"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
